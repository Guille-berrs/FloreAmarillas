<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YELLOW FLOWERS - Para Ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base viewport setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01080e;
      font-family: 'Montserrat', sans-serif;
    }

    /* Container for the entire artwork */
    .scene-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background: radial-gradient(ellipse at 50% 60%, #031c26 0%, #011019 45%, #00070c 85%, #000306 100%);
      overflow: hidden;
    }

    /* Interactive / ambient canvas for fireflies and stars */
    #stars-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Title "PARA TI ❤️ 🤗" */
    .title-banner {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      white-space: nowrap;
      pointer-events: none;
    }

    .title-text {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.45em;
      color: #fffb8f;
      text-shadow: 
        0 0 10px #ffe743,
        0 0 25px rgba(255, 230, 0, 0.75),
        0 0 45px rgba(255, 204, 0, 0.4);
      animation: pulseTitle 3.5s ease-in-out infinite alternate;
    }

    .title-emojis {
      font-size: clamp(1.6rem, 3.6vw, 2.7rem);
      display: inline-flex;
      gap: 12px;
      filter: drop-shadow(0 0 15px rgba(255, 60, 60, 0.6));
      animation: floatEmoji 3s ease-in-out infinite alternate;
    }

    /* SVG Artwork Container - scales smoothly */
    .flowers-svg-wrapper {
      position: relative;
      width: 100%;
      max-width: 780px;
      height: 86vh;
      max-height: 980px;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-origin: bottom center;
    }

    svg.botanical-art {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Ambient glow behind blossoms */
    .halo-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(246, 224, 94, 0.35) 0%, rgba(20, 200, 180, 0.2) 40%, rgba(0, 0, 0, 0) 70%);
      filter: blur(28px);
      z-index: 2;
      pointer-events: none;
      top: 36%;
      animation: breatheGlow 4.5s ease-in-out infinite alternate;
    }

    /* Dynamic sway animations for botanical groups */
    .sway-center {
      transform-origin: 400px 780px;
      animation: swayMiddle 6s ease-in-out infinite alternate;
    }

    .sway-left {
      transform-origin: 380px 760px;
      animation: swayLeftBranch 5.2s ease-in-out infinite alternate;
    }

    .sway-right {
      transform-origin: 420px 760px;
      animation: swayRightBranch 5.8s ease-in-out infinite alternate;
    }

    .flower-head-center {
      transform-origin: 400px 300px;
      animation: nodHead 4s ease-in-out infinite alternate;
    }

    .flower-head-left {
      transform-origin: 260px 420px;
      animation: nodLeft 4.6s ease-in-out infinite alternate;
    }

    .flower-head-right {
      transform-origin: 540px 390px;
      animation: nodRight 4.8s ease-in-out infinite alternate;
    }

    /* Side wild grass swaying */
    .grass-left {
      transform-origin: 60px 850px;
      animation: swayGrassLeft 4s ease-in-out infinite alternate;
    }

    .grass-right {
      transform-origin: 740px 850px;
      animation: swayGrassRight 4.4s ease-in-out infinite alternate;
    }

    /* Subtle pulsing for blossom inner rim */
    .pulse-core {
      animation: coreGlow 2.5s ease-in-out infinite alternate;
    }

    /* Keyframe Definitions */
    @keyframes pulseTitle {
      0% {
        opacity: 0.92;
        text-shadow: 0 0 10px #ffe743, 0 0 20px rgba(255, 230, 0, 0.6);
      }
      100% {
        opacity: 1;
        text-shadow: 0 0 16px #fff48f, 0 0 35px rgba(255, 235, 80, 0.95), 0 0 50px rgba(0, 240, 200, 0.45);
      }
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-4px) scale(1.05); }
    }

    @keyframes breatheGlow {
      0% { opacity: 0.45; transform: scale(0.92); }
      100% { opacity: 0.85; transform: scale(1.12); }
    }

    @keyframes swayMiddle {
      0% { transform: rotate(-1.4deg); }
      100% { transform: rotate(1.6deg); }
    }

    @keyframes swayLeftBranch {
      0% { transform: rotate(-2.2deg); }
      100% { transform: rotate(1.2deg); }
    }

    @keyframes swayRightBranch {
      0% { transform: rotate(-1.2deg); }
      100% { transform: rotate(2.4deg); }
    }

    @keyframes nodHead {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    @keyframes nodLeft {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(1.8deg); }
    }

    @keyframes nodRight {
      0% { transform: rotate(-1.5deg); }
      100% { transform: rotate(3deg); }
    }

    @keyframes swayGrassLeft {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2deg); }
    }

    @keyframes swayGrassRight {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2.8deg); }
    }

    @keyframes coreGlow {
      0% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)); }
      100% { filter: drop-shadow(0 0 14px rgba(255, 240, 130, 0.95)); }
    }

    /* Sound/Interact Prompt Hint */
    .interaction-hint {
      position: absolute;
      bottom: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: rgba(120, 210, 200, 0.45);
      z-index: 25;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <div class="scene-container" id="sceneContainer">
    <!-- Starfield & Firefly Particle Canvas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Warm Ambient Light Behind Flowers -->
    <div class="halo-glow"></div>

    <!-- Top Dedication Heading -->
    <header class="title-banner">

      <div class="title-emojis">
        <span>❤️</span>

    <!-- Botanical Vector Illustration (Scalable 800x1000 ViewBox) -->

          <!-- LEAF GRADIENTS (Smooth Emerald to Deep Teal) -->

            <stop offset="50%" stop-color="#00b0ff" />
            <stop offset="100%" stop-color="#005b64" />

            <stop offset="40%" stop-color="#fdd835" />

            <stop offset="0%" stop-color="#00e676" />
            <stop offset="40%" stop-color="#00796b" />
            <stop offset="80%" stop-color="#004d40" />
            <stop offset="100%" stop-color="#001814" />

          <linearGradient id="grassGradRight" x1="100%" y1="0%" x2="0%" y2="100%">

            <stop offset="50%" stop-color="#004d40" />
            <stop offset="90%" stop-color="#001f1d" />

        </defs>

        <!-- ================= SIDE WILD TALL GRASS ================= -->

          <!-- Far left tall blades -->
          <path d="M10 880 C 15 750, 45 600, 60 520 C 50 630, 40 760, 45 920 Z" fill="url(#grassGradLeft)" />

        <g class="grass-right" id="ambientGrassRight">

          <path d="M710 950 C 700 830, 670 710, 630 630 C 650 730, 665 850, 670 960 Z" fill="url(#grassGradRight)" opacity="0.85" />

        <!-- ================= RIGHT FLOWER BRANCH ================= -->

          <path d="M415 750 Q 470 610 540 425" stroke="url(#stemGradLeft)" stroke-width="13" stroke-linecap="round" fill="none" />

      </svg>
    </div>

    <!-- Small footer prompt for sparkles -->
    <div class="interaction-hint">Toca o mueve el cursor para esparcir magia ✨</div>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      // Handle window resizing
      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStars();
      });

      // Background twinkling stars (small starry backdrop like reference)
      const STARS_COUNT = 160;
      const stars = [];

      function initStars() {
        stars.length = 0;
        for (let i = 0; i < STARS_COUNT; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * (height * 0.75), // Concentrate on upper and mid sky
            radius: Math.random() * 1.2 + 0.3,
            baseAlpha: Math.random() * 0.7 + 0.2,
            alpha: 0.5,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            phase: Math.random() * Math.PI * 2,
            color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#80deea' : '#fff59d')
          });
        }
      }

      // Fireflies & Golden/Cyan Bioluminescent Pollen Particles
      const FIREFLY_COUNT = 45;
      const fireflies = [];

      class Firefly {
        constructor(isBurst = false, originX, originY) {
          this.reset(isBurst, originX, originY);
        }

        reset(isBurst = false, originX, originY) {
          if (isBurst && originX !== undefined) {
            this.x = originX + (Math.random() - 0.5) * 30;
            this.y = originY + (Math.random() - 0.5) * 30;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 2.5 + 0.8;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed - 0.8;
            this.life = 1;
            this.decay = Math.random() * 0.015 + 0.008;
            this.radius = Math.random() * 3.2 + 1.2;
          } else {
            // Natural ambient spawning focused around blossoms
            const blossomClusterX = width * 0.5 + (Math.random() - 0.5) * (width * 0.45);
            const blossomClusterY = height * 0.45 + (Math.random() - 0.5) * (height * 0.35);

            this.x = blossomClusterX;
            this.y = blossomClusterY;
            this.vx = (Math.random() - 0.5) * 0.7;
            this.vy = -Math.random() * 0.6 - 0.2; // Slow upward float
            this.life = Math.random() * 0.8 + 0.2;
            this.decay = Math.random() * 0.004 + 0.002;
            this.radius = Math.random() * 2.8 + 1.2;
          }

          // Golden-yellow or cyan glow colors matching the image
          const palette = [
            { r: 255, g: 235, b: 59, glow: 'rgba(255, 235, 59, ' },   // Gold
            { r: 0,   g: 229, b: 255, glow: 'rgba(0, 229, 255, ' },   // Cyan
            { r: 100, g: 255, b: 218, glow: 'rgba(100, 255, 218, ' }, // Mint/Aqua
            { r: 255, g: 249, b: 196, glow: 'rgba(255, 249, 196, ' }  // Pale Warm Yellow
          ];

          this.theme = palette[Math.floor(Math.random() * palette.length)];
          this.pulse = Math.random() * Math.PI;
          this.pulseSpeed = Math.random() * 0.04 + 0.02;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.pulse += this.pulseSpeed;

          // Natural float oscillation
          this.x += Math.sin(this.pulse) * 0.35;
          this.life -= this.decay;

          if (this.life <= 0 || this.y < -30 || this.x < -30 || this.x > width + 30) {
            this.reset();
          }
        }

        draw(ctx) {
          const currentAlpha = Math.max(0, Math.sin(this.pulse) * 0.4 + 0.6) * this.life;
          const currentRadius = this.radius * (0.8 + 0.3 * Math.sin(this.pulse));

          // Outer Glow
          const grad = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, currentRadius * 3.8
          );
          grad.addColorStop(0, this.theme.glow + (currentAlpha * 0.8) + ')');
          grad.addColorStop(0.4, this.theme.glow + (currentAlpha * 0.35) + ')');
          grad.addColorStop(1, this.theme.glow + '0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, currentRadius * 3.8, 0, Math.PI * 2);
          ctx.fill();

          // Core Spark
          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, currentRadius * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Initialize ambient collection
      initStars();
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        fireflies.push(new Firefly());
      }

      // Interactive click / touch / mouse bursts
      const burstParticles = [];

      function spawnBurst(posX, posY, amount = 8) {
        for (let i = 0; i < amount; i++) {
          burstParticles.push(new Firefly(true, posX, posY));
        }
        if (burstParticles.length > 80) {
          burstParticles.splice(0, burstParticles.length - 80);
        }
      }

      window.addEventListener('pointerdown', (e) => {
        spawnBurst(e.clientX, e.clientY, 12);
      });

      let lastMove = 0;
      window.addEventListener('pointermove', (e) => {
        const now = Date.now();
        if (now - lastMove > 70) {
          spawnBurst(e.clientX, e.clientY, 2);
          lastMove = now;
        }
      });

      function animate() {
        ctx.clearRect(0, 0, width, height);

        // Render Background Stars
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.phase += s.twinkleSpeed;
          const a = s.baseAlpha + Math.sin(s.phase) * 0.35;
          ctx.fillStyle = s.color;
          ctx.globalAlpha = Math.max(0.1, Math.min(1, a));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Render Ambient Fireflies
        for (let i = 0; i < fireflies.length; i++) {
          fireflies[i].update();
          fireflies[i].draw(ctx);
        }

        // Render Interactive Burst Particles
        for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) {
            burstParticles.splice(i, 1);
        }
        }

        requestAnimationFrame(animate);
     }

      // Start animation loop cleanly
      window.onload = function () {
        animate();
      };
    })();
  </script>
</body>
